name: Bug Report
description: Report a bug or unexpected behavior in DevDash
title: '[Bug]: '
labels: ['bug', 'needs-triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us fix it quickly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest version of DevDash.
          required: true
        - label: I have reloaded the extension after the issue appeared.
          required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: 'When I open a new tab, the clock widget shows the wrong timezone...'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open a new tab
        2. Look at the clock
        3. Notice the time is wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include screenshots if applicable.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Open DevTools (F12) and paste any errors from the Console tab.
      render: text

  - type: input
    id: version
    attributes:
      label: DevDash Version
      description: Found in `chrome://extensions` under DevDash.
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome Version
      description: Found at `chrome://settings/help`.
      placeholder: '122.0.6261.94'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or links that may be helpful.
